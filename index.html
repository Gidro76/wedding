<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Свадьба</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="invitation">

    <p class="pre-title">Приглашение на свадьбу</p>

    <h1 class="names">
      <span>ИМЯ_1</span>
      <span class="amp">&</span>
      <span>ИМЯ_2</span>
    </h1>

    <p class="date-line">
      <span class="date-day">ДД</span>
      <span class="date-sep">·</span>
      <span class="date-month">МЕСЯЦ</span>
      <span class="date-sep">·</span>
      <span class="date-year">ГГГГ</span>
    </p>

    <div class="divider">✦</div>

    <p class="greeting" id="greeting">Дорогие гости!</p>

    <p class="body-text">
      С радостью приглашаем вас разделить с нами самый
      важный и счастливый день нашей жизни.
    </p>

    <p class="body-text">
      Будем счастливы видеть вас на нашей свадьбе.
    </p>

    <div class="details">
      <div class="detail">
        <p class="detail-label">Когда</p>
        <p class="detail-value">ДД месяца ГГГГ, ЧЧ:ММ</p>
      </div>
      <div class="detail">
        <p class="detail-label">Где</p>
        <p class="detail-value">Название места, адрес</p>
      </div>
    </div>

    <a href="#rsvp" class="rsvp-btn" id="rsvp-btn">Подтвердить присутствие</a>

  </main>

  <script src="script.js"></script>
</body>
</html>
